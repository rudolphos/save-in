name: Pack Chromium extension archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Pack extension archive
        run: |
          mkdir -p dist
          
          # Zip only production files directly into the root of the archive
          zip -r "dist/extension-v${{ env.VERSION }}.zip" \
            manifest.json \
            background-wrapper.js \
            src \
            icons \
            _locales
            
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveIn-extension-v${{ env.VERSION }}
          path: dist/extension-v${{ env.VERSION }}.zip
          retention-days: 14
